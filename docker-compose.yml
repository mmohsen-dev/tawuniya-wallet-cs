services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: tawuniya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tawuniya_wallet
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tawuniya-network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tawuniya-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/tawuniya_wallet?schema=public"
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
      JWT_EXPIRES_IN: "7d"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tawuniya-network
    # Uncomment below to run migrations and seed on startup
    command: >
      sh -c "
        npx prisma migrate deploy &&
        npx prisma db seed &&
        node server.js
      "

volumes:
  postgres_data:
    driver: local

networks:
  tawuniya-network:
    driver: bridge

