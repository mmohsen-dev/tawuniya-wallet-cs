services:
  # PostgreSQL Database (for development)
  postgres:
    image: postgres:16-alpine
    container_name: tawuniya-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tawuniya_wallet
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tawuniya-network

  # Next.js Application (Development mode with hot reload)
  app:
    image: node:20-alpine
    container_name: tawuniya-app-dev
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
      - "5555:5555"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/tawuniya_wallet?schema=public"
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
      JWT_EXPIRES_IN: "7d"
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tawuniya-network
    command: >
      sh -c "
        npm install &&
        npx prisma generate &&
        npx prisma migrate deploy &&
        npm run prisma:seed &&
        npm run dev
      "

volumes:
  postgres_dev_data:
    driver: local

networks:
  tawuniya-network:
    driver: bridge

